name: test install

on:
  push:
    paths:
      - 'scripts/install.sh'
      - '.github/workflows/test-install.yml'
  pull_request:
    paths:
      - 'scripts/install.sh'
      - '.github/workflows/test-install.yml'
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - ghcr.io/pterodactyl/installers:debian
          - debian:trixie-slim
    steps:
      - uses: actions/checkout@v4

      - name: Run the installer the way wings runs it
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/testserver"
          docker run --rm \
            --tmpfs /tmp:rw,exec,nosuid,size=100M \
            -v "${GITHUB_WORKSPACE}/scripts:/mnt/install:ro" \
            -v "${GITHUB_WORKSPACE}/testserver:/mnt/server" \
            -e SERVER_PORT=30120 \
            -e CFX_CHANNEL=main \
            -e CORECLR_CHANNEL=csharp_improvements \
            -e DOWNLOAD_SERVER_DATA=1 \
            --entrypoint bash \
            ${{ matrix.container }} \
            /mnt/install/install.sh

      - name: Check what actually landed on disk
        run: |
          ls -la testserver
          test -f testserver/cfx-server.exe
          test -f testserver/libnode26.dll
          test -f testserver/server.cfg
          test -f testserver/coreclr_server/CitizenFX.Host.Server.dll
          test -d testserver/coreclr_server/runtime/shared/Microsoft.NETCore.App
          ls testserver/coreclr_server/runtime/shared/Microsoft.NETCore.App/*/coreclr.dll
          test -d testserver/system_resources/chat
          test -d testserver/resources
          test -f testserver/.cfx-build
          cat testserver/.cfx-build
          echo "file count: $(find testserver -type f | wc -l)"

      - name: Boot the server under wine and watch the C# host
        if: matrix.container == 'ghcr.io/pterodactyl/installers:debian'
        continue-on-error: true
        run: |
          IMAGE="ghcr.io/tomgrobbe/cfx-server-wine:latest"
          docker pull "$IMAGE"
          sudo chown -R 1000:1000 testserver
          docker rm -f cfxboot > /dev/null 2>&1 || true
          docker run -d --name cfxboot \
            -v "${GITHUB_WORKSPACE}/testserver:/home/container" \
            -e STARTUP='wine cfx-server.exe +exec server.cfg' \
            "$IMAGE" > /dev/null
          for i in $(seq 1 24); do
            sleep 5
            docker logs cfxboot 2>&1 | grep -q "citizen-server-i" && break
            [ "$(docker inspect -f '{{.State.Running}}' cfxboot)" = "true" ] || break
          done
          OUT=$(docker logs cfxboot 2>&1 || true)
          docker rm -f cfxboot > /dev/null 2>&1 || true
          echo "$OUT"
          echo "----- checking the C# host -----"
          if echo "$OUT" | grep -q "load_assembly for Bootstrap failed"; then
            echo "FAIL: the CoreCLR host could not load Bootstrap"
            exit 1
          fi
          if ! echo "$OUT" | grep -q "citizen"; then
            echo "INCONCLUSIVE: no citizen log lines, most likely no license key"
            exit 1
          fi
          echo "the server booted and the CoreCLR host loaded Bootstrap"
